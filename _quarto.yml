project:
  type: website
  output-dir: _site
  render:
    - index.qmd

website:
  title: "Maria Eugenia Romero"
  description: "Environmental scientist working across fisheries, marine and freshwater systems, geospatial analysis and environmental policy."
  site-url: "https://eugerom.github.io"
  favicon: images/favicon.svg
  navbar: false
  open-graph:
    title: "Maria Eugenia Romero | Environmental Science & Spatial Analysis"
    description: "Environmental scientist working across fisheries, marine and freshwater systems, geospatial analysis and environmental policy."
    image: images/social-preview.png
  twitter-card:
    title: "Maria Eugenia Romero | Environmental Science & Spatial Analysis"
    description: "Environmental scientist working across fisheries, marine and freshwater systems, geospatial analysis and environmental policy."
    image: images/social-preview.png
    card-style: summary_large_image

format:
  html:
    theme: none
    css: styles.css
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      text: |
        <meta name="theme-color" content="#f5f1e8">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
